<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KokoRoom</title>
    <meta name="description" content="{{description}}" />
    <meta property="og:title" content="KokoRoom" />
    <meta property="og:description" content="{{description}}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/screenshot-today.png" />
    <link rel="icon" href="assets/app-icon.png" />
    <link rel="stylesheet" href="/assets/home.css" />
  </head>
  <body class="home-page">
    <main class="page">
      <section class="hero" aria-label="KokoRoom landing hero">
        <div class="brand">
          <img class="app-icon" src="assets/app-icon.png" alt="KokoRoom app icon" />
          <h1 class="brand-title"><img class="logo" src="assets/logo.png" alt="KokoRoom" /></h1>
          <p class="tagline">{{tagline}}</p>
          <div class="store-buttons" aria-label="Download links">
            <a class="store-button" href="https://apps.apple.com/app/kokoroom-period-pms-reminder/id6775430618" target="_blank" rel="noopener noreferrer" aria-label="Download on the App Store">
              <img src="assets/app-store.png" alt="Download on the App Store" />
            </a>
            <a class="store-button" href="https://play.google.com/store/apps/details?id=com.aanug.kokoroom" target="_blank" rel="noopener noreferrer" aria-label="Get it on Google Play">
              <img src="assets/google-play.png" alt="Get it on Google Play" />
            </a>
          </div>
        </div>
        <div class="phones" aria-hidden="true">
          <img class="phone back" src="assets/screenshot-analysis.png" alt="" />
          <img class="phone front" src="assets/screenshot-today.png" alt="" />
        </div>
      </section>
      <footer class="footer">
        <div class="footer-inner">
          <strong>Contact us</strong>
          <p><a href="mailto:aanug@aanug.com">aanug@aanug.com</a></p>
          <nav class="footer-links" aria-label="Legal links">
            <a href="/terms/">Terms of Service</a>
            <span>|</span>
            <a href="/privacy/">Privacy Policy</a>
          </nav>
          <p class="copyright" lang="en">© 2026 aanug. All rights reserved.</p>
        </div>
      </footer>
    </main>
  </body>
</html>
